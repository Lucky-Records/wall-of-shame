# The Wall of Shame — Cloudflare Pages
# Deploy with: npm run deploy
# Node 20 note: use project-local wrangler@3.x (global wrangler 4+ needs Node 22).
name = "wall-of-shame"
compatibility_date = "2024-11-11"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "GRAPH_KV"
id = "f5589df19cc74053b800376d7f0cad78"

# Member logins, sessions and login log (see migrations/).
[[d1_databases]]
binding = "DB"
database_name = "wall-of-shame-db"
database_id = "00000000-0000-0000-0000-000000000000" # TODO: real id after `wrangler d1 create wall-of-shame-db`
migrations_dir = "migrations"
